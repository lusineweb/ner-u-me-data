name: Navdêran nû bike

on:
  schedule:
    - cron: '17 3 1 * *'   # her meh, roja 1ê
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-extract.mjs
      - run: node scripts/fetch-nouns.mjs ner-u-me-wiki.json
      - run: node scripts/build-data.mjs ner-u-me-wiki.json
      - name: Commit
        run: |
          git config user.name "ner-u-me-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data
          if git diff --cached --quiet; then echo "Tu guhertin tune."; exit 0; fi
          git commit -m "Daneyên navdêran nû bûn ($(date -u +%Y-%m-%d))"
          git push
